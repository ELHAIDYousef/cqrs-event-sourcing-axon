<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des opérations en temps réel</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.5rem; }
  .controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  input { padding: .4rem .6rem; border: 1px solid #aaa; border-radius: 4px; }
  button { padding: .4rem .9rem; border: 0; border-radius: 4px; background: #1565c0; color: #fff; cursor: pointer; }
  button#stop { background: #616161; }
  #status { font-weight: bold; padding: .2rem .6rem; border-radius: 12px; }
  #status.connected { background: #c8e6c9; color: #1b5e20; }
  #status.disconnected { background: #ffcdd2; color: #b71c1c; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
  th { background: #f5f5f5; }
  .CREDIT { color: #2e7d32; font-weight: bold; }
  .DEBIT { color: #c62828; font-weight: bold; }
</style>
</head>
<body>
<h1>Suivi des opérations en temps réel</h1>

<div class="controls">
  <label for="accountId">accountId</label>
  <input id="accountId" type="text" placeholder="accountId">
  <button id="follow">Suivre</button>
  <button id="stop">Arrêter</button>
  <span id="status" class="disconnected">déconnecté</span>
</div>

<table>
  <thead>
    <tr><th>Type</th><th>Montant</th><th>Date</th></tr>
  </thead>
  <tbody id="operations"></tbody>
</table>

<script>
  const accountInput = document.getElementById('accountId');
  const statusLabel = document.getElementById('status');
  const operations = document.getElementById('operations');
  let source = null;

  function setStatus(connected) {
    statusLabel.textContent = connected ? 'connecté' : 'déconnecté';
    statusLabel.className = connected ? 'connected' : 'disconnected';
  }

  function addCell(row, text, className) {
    const cell = document.createElement('td');
    cell.textContent = text;
    if (className) cell.className = className;
    row.appendChild(cell);
  }

  function formatDate(value) {
    const date = new Date(value);
    return isNaN(date.getTime()) ? String(value ?? '') : date.toLocaleString('fr-FR');
  }

  function addOperation(operation) {
    const row = document.createElement('tr');
    const type = String(operation.type ?? '').toUpperCase();
    addCell(row, type, type === 'CREDIT' || type === 'DEBIT' ? type : '');
    addCell(row, operation.amount + ' ' + (operation.currency ?? ''));
    addCell(row, formatDate(operation.date ?? operation.timestamp));
    operations.prepend(row);
  }

  function stop() {
    if (source) {
      source.close();
      source = null;
    }
    setStatus(false);
  }

  function follow() {
    const id = accountInput.value.trim();
    if (!id) return;
    if (source) source.close();
    operations.replaceChildren();
    source = new EventSource('/query/accounts/watch/' + encodeURIComponent(id));
    source.onopen = () => setStatus(true);
    source.onmessage = (event) => {
      if (!event.data) return;
      const operation = JSON.parse(event.data);
      if (!operation) return;
      setStatus(true);
      addOperation(operation);
    };
    source.onerror = () => setStatus(false);
  }

  document.getElementById('follow').addEventListener('click', follow);
  document.getElementById('stop').addEventListener('click', stop);
</script>
</body>
</html>
