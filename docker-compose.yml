services:
  postgres:
    image: postgres:18.7
    container_name: account-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - account-net

  pgadmin:
    image: dpage/pgadmin4:9.19.0
    container_name: account-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - account-net

  axonserver:
    image: axoniq/axonserver:2026.1.8
    container_name: account-axonserver
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"
    ports:
      - "8024:8024"
      - "8124:8124"
    volumes:
      - axonserver-data:/axonserver/data
      - axonserver-events:/axonserver/events
    networks:
      - account-net

volumes:
  postgres-data:
  axonserver-data:
  axonserver-events:

networks:
  account-net:
